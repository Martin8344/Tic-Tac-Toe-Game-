<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="background-simulation">
        <div class="grid-lines"></div>
        <div class="blue-orb"></div>
        <div class="red-orb"></div>
    </div>

    <div class="top-controls-bar">

        <div class="left-dock">
            <div class="control-item">
                <button class="icon-btn sound-btn" id="soundToggleBtn" title="Mute / Unmute Sound">
                    <svg class="icon-svg" id="soundIconOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    </svg>
                    <svg class="icon-svg hidden" id="soundIconOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <line x1="23" y1="9" x2="17" y2="15"></line>
                        <line x1="17" y1="9" x2="23" y2="15"></line>
                    </svg>
                </button>
                <input type="range" id="soundVolume" class="volume-slider blue-slider" min="0" max="100" value="80" title="Sound Volume">
            </div>

            <div class="control-item">
                <button class="icon-btn music-btn" id="musicToggleBtn" title="Mute / Unmute Music">
                    <svg class="icon-svg" id="musicIconOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 18V5l12-2v13"></path>
                        <circle cx="6" cy="18" r="3"></circle>
                        <circle cx="18" cy="16" r="3"></circle>
                    </svg>
                    <svg class="icon-svg hidden" id="musicIconOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 18V5l12-2v13"></path>
                        <circle cx="6" cy="18" r="3"></circle>
                        <circle cx="18" cy="16" r="3"></circle>
                        <line x1="2" y1="2" x2="22" y2="22"></line>
                    </svg>
                </button>
                <input type="range" id="musicVolume" class="volume-slider red-slider" min="0" max="100" value="65" title="Music Volume">
            </div>
        </div>

        <div class="right-dock">
            <div class="track-item">
                <span class="track-icon-box" title="Select Music Track">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </span>
                <select id="musicSelect" class="music-select" title="Choose Background Music">
                    <option value="chill">Neon Chill</option>
                    <option value="arcade">Retro Arcade</option>
                    <option value="lofi">Calm Lo-Fi</option>
                    <option value="cyber">Cyber Pulse</option>
                </select>
            </div>
        </div>

    </div>

    <div class="app-wrapper">

        <div class="header-section">
            <img src="../images/xo.png" alt="Tic Tac Toe Logo" class="logo-img">
            <h1 class="main-title">TIC TAC TOE</h1>
        </div>

        <div class="setup-card" id="setupCard">
            <h2 class="setup-title">Enter Players Names</h2>

            <div class="input-box blue-input-box">
                <img src="../images/x.png" alt="X Symbol" class="symbol-icon">
                <input type="text" id="playerOneInput" class="player-input" placeholder="Player 1 Name (X)" maxlength="15">
            </div>

            <div class="input-box red-input-box">
                <img src="../images/o.png" alt="O Symbol" class="symbol-icon">
                <input type="text" id="playerTwoInput" class="player-input" placeholder="Player 2 Name (O)" maxlength="15">
            </div>

            <p class="error-msg" id="errorMsg"></p>

            <button class="start-btn" id="startBtn">Start Game</button>
        </div>

        <div class="game-area hidden" id="gameArea">

            <div class="scoreboard">
                <div class="player-card blue-player-card" id="playerOneCard">
                    <img src="../images/x.png" alt="X" class="card-icon">
                    <div class="player-details">
                        <span class="player-name" id="playerOneName">Player 1</span>
                        <span class="player-wins">Wins: <strong class="win-count" id="playerOneScore">0</strong></span>
                    </div>
                </div>

                <div class="player-card red-player-card" id="playerTwoCard">
                    <img src="../images/o.png" alt="O" class="card-icon">
                    <div class="player-details">
                        <span class="player-name" id="playerTwoName">Player 2</span>
                        <span class="player-wins">Wins: <strong class="win-count" id="playerTwoScore">0</strong></span>
                    </div>
                </div>
            </div>

            <div class="turn-banner" id="turnBanner">
                <img src="../images/x.png" alt="Current Turn" class="turn-img" id="turnImg">
                <span class="turn-text" id="turnText">Player 1's Turn</span>
            </div>

            <div class="board-container">
                <div class="board" id="board">
                    <div class="cell" data-index="0"></div>
                    <div class="cell" data-index="1"></div>
                    <div class="cell" data-index="2"></div>
                    <div class="cell" data-index="3"></div>
                    <div class="cell" data-index="4"></div>
                    <div class="cell" data-index="5"></div>
                    <div class="cell" data-index="6"></div>
                    <div class="cell" data-index="7"></div>
                    <div class="cell" data-index="8"></div>
                </div>

                <div class="celebration-overlay hidden" id="celebrationOverlay">
                    <div class="celebration-card" id="celebrationCard">
                        <div class="spark-row">
                            <span class="spark blue-spark"></span>
                            <span class="spark red-spark"></span>
                            <span class="spark blue-spark"></span>
                            <span class="spark red-spark"></span>
                            <span class="spark blue-spark"></span>
                        </div>

                        <img src="../images/x.png" alt="Winner Symbol" class="winner-img" id="winnerImg">
                        <p class="celebration-badge" id="celebrationBadge">CONGRATULATIONS!</p>
                        <h2 class="winner-title" id="winnerTitle">Player 1 Wins!</h2>

                        <div class="action-buttons">
                            <button class="action-btn play-again-btn" id="playAgainBtn">Play Again</button>
                            <button class="action-btn reset-score-btn" id="resetScoreBtn">Reset Score</button>
                            <button class="action-btn new-players-btn" id="newPlayersBtn">Change Players</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <audio id="winSound" src="../sounds/win.mp3" preload="auto"></audio>

    <script src="../js/script.js"></script>
</body>
</html>
